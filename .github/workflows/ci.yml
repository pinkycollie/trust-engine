name: Trust Engine CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "openapi/**"
      - "package.json"
      - "tsconfig.json"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx @redocly/cli lint openapi/trust-engine.yaml
